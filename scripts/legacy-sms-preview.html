<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>旧 SMS → Hydro 迁移预览</title>
<style>
:root{color-scheme:light;--ink:#263c50;--muted:#6e8093;--line:#dfe6ed;--blue:#358dca}*{box-sizing:border-box}body{margin:0;background:#edf1f4;color:var(--ink);font:14px/1.6 system-ui,sans-serif}main{max-width:1540px;margin:auto;padding:28px}header{display:flex;align-items:center;justify-content:space-between;gap:18px}h1{font-size:26px;margin:0 0 8px;font-weight:600}p{margin:5px 0}.muted,small{color:var(--muted)}.pill{background:#edf5fb;color:var(--blue);padding:4px 10px;border-radius:4px;white-space:nowrap}.cards{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;margin:24px 0}.card,.panel{background:white;border:1px solid var(--line);border-radius:6px}.card{padding:16px}.card strong{display:block;font-size:27px}.card span{color:var(--muted)}.panel{padding:18px;margin-bottom:20px}details{margin-top:8px}summary{cursor:pointer;color:var(--blue)}.toolbar{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}input,select,button{font:inherit;height:36px;border:1px solid var(--line);border-radius:4px;padding:0 10px;background:white;color:inherit}input{width:320px;max-width:100%}button{cursor:pointer;color:var(--blue)}button:hover{background:#edf5fb}.download{margin-left:auto}.scroll{overflow:auto}table{border-collapse:collapse;width:100%;min-width:1050px;text-align:left}th{color:var(--muted);font-weight:500;background:#f8fafc;white-space:nowrap}td,th{padding:14px 12px;border-bottom:1px solid var(--line);vertical-align:top}td:nth-child(1){width:17%}td:nth-child(2){width:13%}td:nth-child(3){width:12%}td:nth-child(4){width:32%}td:nth-child(5){width:18%}td:nth-child(6){width:8%}.name{font-size:15px;font-weight:600}.warn{color:#a06b13}.danger{color:#b7454f}.ok{color:#278461}.sub{font-size:12px;color:var(--muted);overflow-wrap:anywhere}td select{width:100%;max-width:450px;margin-bottom:6px}ul{margin:6px 0;padding-left:20px}code{overflow-wrap:anywhere;font-size:12px}footer{font-size:12px;color:var(--muted);margin-top:16px}.history{min-width:0;font-size:12px}.history th,.history td{padding:5px}.empty{text-align:center;padding:30px;color:var(--muted)}@media(max-width:800px){main{padding:14px}.cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}header{align-items:flex-start}h1{font-size:22px}.panel{padding:12px}.download{margin-left:0}.toolbar input{flex:1;min-width:160px}.card{padding:12px}}
</style>
<main><header><div><h1>旧 SMS → Hydro 迁移预览</h1><p class="muted" id="subtitle"></p></div><span class="pill">只读预览 · 尚未导入</span></header><div class="cards" id="cards"></div>
<section class="panel"><p><strong>迁移范围：</strong>学生基本资料、已确认 Hydro UID、Rating 分数与记录时间。</p><p class="muted">保留现有 Hydro 账号、密码与权限。此页面只在本地筛选和编辑映射，不连接站点，不创建档案或账号。</p><details><summary>匹配规则与需要确认的问题</summary><ul id="rules"></ul><p id="issues"></p><p class="sub" id="fingerprints"></p></details></section>
<section class="panel"><div class="toolbar"><input id="q" type="search" placeholder="搜索学生、账号、学校或 UID" aria-label="搜索预览"><select id="filter" aria-label="筛选匹配状态"><option value="all">全部匹配状态</option><option value="proposed">建议匹配</option><option value="ambiguous">多个账号候选</option><option value="review">需要人工复核</option><option value="unmatched">未匹配</option><option value="blocked">受保护或已有绑定</option><option value="rating">Rating 待处理</option></select><span class="muted" id="count"></span><button type="button" class="download" id="download">下载待确认映射 JSON</button></div><div class="scroll"><table><thead><tr><th>旧 SMS 学生</th><th>基本资料</th><th>匹配状态</th><th>Hydro 账号 / 匹配依据</th><th>Rating 历史</th><th>资料迁移</th></tr></thead><tbody id="rows"></tbody></table></div></section><footer>导入前仍需确认选定 UID、处理冲突并重新核对快照。页面中修改的映射须下载保存，刷新会恢复原预览。未匹配项默认保留待处理。</footer></main>
<script type="application/json" id="data">/*__PREVIEW_DATA__*/</script>
<script>
'use strict';const report=JSON.parse(document.getElementById('data').textContent),state=new Map(report.rows.map(r=>[r.sourceStudentId,{uid:r.proposedUid,includeProfile:!!r.proposedUid,includeRating:!!r.proposedUid&&!r.ratingIssues.length}])),labels={proposed:'建议匹配',review:'人工复核',ambiguous:'多个账号候选',unmatched:'未匹配',blocked:'禁止自动绑定'};
const el=(tag,cls,text)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=String(text);return n;};
document.getElementById('subtitle').textContent=`${report.summary.sourceStudents} 名学生 · ${report.summary.sourceHistory} 条 Rating · 目标数据库 ${report.target.database}`;
for(const[label,value]of[['建议匹配',report.summary.statuses.proposed],['多个候选',report.summary.statuses.ambiguous],['人工复核',report.summary.statuses.review],['未匹配',report.summary.statuses.unmatched],['绑定受限',report.summary.statuses.blocked],['Rating 待处理学生',report.summary.ratingIssueStudents]]){const n=el('div','card');n.append(el('strong','',value),el('span','',label));document.getElementById('cards').append(n);}
for(const text of[report.rules.matching,report.rules.time,'旧状态为空时按插件现有规则设为在校。','不导入：'+report.rules.excluded.join('、'),'多个旧档案指向同一 Hydro UID 时须先确认；不会合并账号或覆盖已有档案。','Rating 同一 UID、同一时刻不同分数为阻断项；不会自动改时间、取最大值或舍弃冲突记录。'])document.getElementById('rules').append(el('li','',text));
document.getElementById('issues').textContent=`原始 Rating：${report.summary.sourceHistory} 条；相同时间相同分数重复：${report.summary.duplicateRecords} 条；仅日期精度：${report.summary.dateOnlyRecords} 条；存在 ${report.summary.ratingIssueCount} 项 Rating 问题。`;
document.getElementById('fingerprints').textContent=`源文件 SHA-256：${report.source.sha256}；目标快照：${report.target.snapshotSha256}`;
function render(){const q=document.getElementById('q').value.trim().toLowerCase(),filter=document.getElementById('filter').value,rows=report.rows.filter(r=>(filter==='all'||filter==='rating'?filter==='all'||r.ratingIssues.length:r.status===filter)&&(!q||[r.name,r.basic.school,r.basic.grade,...r.legacyUsernames,...r.candidates.flatMap(c=>[c.uid,c.username,c.realName])].join(' ').toLowerCase().includes(q)));const host=document.getElementById('rows');host.replaceChildren();document.getElementById('count').textContent=`${rows.length} / ${report.rows.length} 名`;
for(const r of rows){const tr=el('tr'),who=el('td'),info=el('td'),status=el('td'),match=el('td'),rating=el('td'),decision=el('td'),s=state.get(r.sourceStudentId);who.append(el('div','name',r.name),el('div','sub',r.legacyUsernames.join(' / ')||'无旧账号'));const source=el('details');source.append(el('summary','sub','来源标识'),el('code','',r.sourceStudentId));who.append(source);info.append(el('div','',r.basic.grade||'—'),el('div','sub',r.basic.school||'—'),el('div','sub',[r.basic.gender,r.basic.status].filter(Boolean).join(' · ')));status.append(el('span',r.status==='proposed'?'ok':r.status==='blocked'?'danger':'warn',labels[r.status]));for(const n of r.issues)status.append(el('div','danger',n));
if(r.candidates.length){const select=el('select'),empty=el('option','','暂不绑定 / 等待确认');empty.value='';select.append(empty);for(const c of r.candidates){const o=el('option','',`UID ${c.uid} · ${c.username}${c.realName?' · '+c.realName:''}${c.blocked?'（绑定受限）':''}`);o.value=c.uid;o.disabled=c.blocked;select.append(o);}select.value=s.uid||'';select.onchange=()=>{s.uid=select.value?Number(select.value):null;s.includeProfile=!!s.uid;s.includeRating=!!s.uid&&!r.ratingIssues.length;render();};match.append(select);for(const c of r.candidates){const box=el('div','sub');box.append(el('strong','',`UID ${c.uid} · ${c.username}`),el('div','',c.evidence.join('；')));for(const w of c.warnings)box.append(el('div','warn',w));match.append(box);}}
else match.append(el('span','muted','需要提供现有 Hydro UID，当前不创建新账号'));
for(const note of r.notes)if(!r.issues.includes(note))match.append(el('div','sub',note));rating.append(el('div','',`${r.historyCount} 条 · 最新 ${r.latestHistoryRating??'—'}`));for(const issue of r.ratingIssues)rating.append(el('div','danger',[issue.reason,issue.time,issue.ratings?.join(' / '),issue.examNames?.join(' / ')].filter(Boolean).join(' · ')));
if(r.history.length){const detail=el('details');detail.append(el('summary','sub','查看记录时间与分数'));const t=el('table','history');for(const h of r.history){const row=el('tr');row.append(el('td','',h.sourceTime),el('td','',h.rating),el('td','',h.sourceExamName));t.append(row);}detail.append(t);rating.append(detail);}const check=el('input');check.type='checkbox';check.checked=s.includeProfile;check.disabled=!s.uid;check.style.width='auto';check.style.height='auto';check.setAttribute('aria-label','迁移 '+r.name+' 的基本资料');check.onchange=()=>{s.includeProfile=check.checked;s.includeRating=s.includeProfile&&!!s.uid&&!r.ratingIssues.length;};decision.append(check);tr.append(who,info,status,match,rating,decision);host.append(tr);}
if(!rows.length){const tr=el('tr'),td=el('td','empty','没有符合条件的记录');td.colSpan=6;tr.append(td);host.append(tr);}}
document.getElementById('q').oninput=render;document.getElementById('filter').onchange=render;document.getElementById('download').onclick=()=>{const output={format:'hydro-sms-migration-decisions-v1',sourceSha256:report.source.sha256,targetSnapshotSha256:report.target.snapshotSha256,confirmed:false,decisions:report.rows.map(r=>({sourceStudentId:r.sourceStudentId,name:r.name,...state.get(r.sourceStudentId),approved:false}))};const a=el('a');a.download='review-decisions.json';a.href=URL.createObjectURL(new Blob([JSON.stringify(output,null,2)],{type:'application/json'}));a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);};render();
</script></html>
