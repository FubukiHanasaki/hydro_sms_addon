{% extends "contest_edit.html" %}
{% block content %}
{{ super() }}
<div id="sms-contest-edit-fields" hidden>
  <div class="section__header"><h2 class="section__title">模拟赛设置</h2></div>
  <div class="section__body">
    <input type="hidden" name="smsVersion" value="{{ smsEditor.exam.version }}">
    <div class="row">
      <div class="medium-6 columns"><label>比赛类型<select name="smsExamType">{% for kind in smsEditor.examTypes %}<option value="{{ kind }}"{% if kind == smsEditor.exam.examType %} selected{% endif %}>{{ kind }}</option>{% endfor %}</select></label></div>
      <div class="medium-6 columns"><label>比赛难度<select name="smsDifficulty">{% for level in smsEditor.difficulties %}<option value="{{ level }}"{% if level == smsEditor.difficulty %} selected{% endif %}>{{ level }}</option>{% endfor %}</select></label></div>
    </div>
    <div class="row">
      <div class="medium-6 columns"><label>比赛显示<select name="smsVisibility"><option value="visible"{% if smsEditor.visibility == 'visible' %} selected{% endif %}>正常显示</option><option value="hidden"{% if smsEditor.visibility == 'hidden' %} selected{% endif %}>保持隐藏</option><option value="until"{% if smsEditor.visibility == 'until' %} selected{% endif %}>指定时间前隐藏</option></select></label></div>
      <div class="medium-6 columns" id="sms-visible-at"><label>公开时间（北京时间）<input class="textbox" type="datetime-local" name="smsVisibleAt" value="{{ smsEditor.visibleAt }}"></label></div>
    </div>
    <label>说明<textarea class="textbox" name="smsRemark" maxlength="2000" rows="3">{{ smsEditor.exam.remark }}</textarea></label>
  </div>
</div>
<script>
(() => {
 const fields=document.getElementById('sms-contest-edit-fields');
 const form=document.querySelector('form[method="post"]');
 if(!fields||!form)return;
 const settings=form.querySelector('input[name="langs"]')?.closest('.section__body');
 const target=settings?.previousElementSibling;
 if(target)target.before(fields);else form.append(fields);
 fields.hidden=false;
 const visibility=fields.querySelector('[name="smsVisibility"]'),until=fields.querySelector('[name="smsVisibleAt"]');
 const syncVisibility=()=>{const timed=visibility.value==='until';document.getElementById('sms-visible-at').hidden=!timed;until.disabled=!timed;until.required=timed;};
 visibility.addEventListener('change',syncVisibility);syncVisibility();
 // Validate before Hydro's submit-click throttle, so correcting the time can be saved immediately.
 form.addEventListener('click',(event)=>{
   const button=event.target.closest('button[type="submit"],input[type="submit"]');
   if(!button||visibility.value!=='until'||until.validity.valid)return;
   event.preventDefault();event.stopPropagation();until.reportValidity();
 },true);
 {% if not smsEditor.canDelete %}form.querySelector('button[value="delete"]')?.remove();{% endif %}
 // One Rated control for both Hydro and SMS, including explicit false.
 const rated=form.querySelector('input[type="checkbox"][name="rated"]');
 if(rated)rated.checked={{ 'true' if smsEditor.rated else 'false' }};
})();
</script>
{% endblock %}
