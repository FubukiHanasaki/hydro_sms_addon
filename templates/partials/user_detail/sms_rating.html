<li class="section__tab-item">
  <h1 class="section__tab-title">Rating</h1>
  <div class="section__tab-main"><div class="section__body" data-sms-profile-rating="{{ udoc._id }}" data-api="{{ url('sms_api_rating_history', uid=udoc._id) }}">
    <div class="sms-rating-metrics"><div><span>当前 Rating</span><strong>{{ udoc.smsRating.rating|default(0) }}</strong></div><div><span>头衔</span><strong class="sms-rating-tier-value">{{ udoc.smsRating.title|default('未评级') }}</strong></div><div><span>最高 Rating</span><strong>{{ udoc.smsRating.peak|default(0) }}</strong></div></div>
    <div class="sms-profile-chart"></div>
    {% if handler.user._id %}<button type="button" class="rounded button sms-profile-history">历史记录</button>{% endif %}
<link rel="stylesheet" href="/sms-addon/rating.css?build=rating-ui-20261021">
<script src="/sms-addon/rating.js?build=rating-ui-20261021" defer></script>
  </div></div>
</li>
